server:
  port: 0

spring:
  application:
    name: pilates-backend-test
  datasource:
    url: jdbc:h2:mem:pilates_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

supabase:
  url: https://test.supabase.co
  jwt-secret: testing-secret-key-that-is-at-least-32-bytes-long-for-hs256!
  service-role-key: test-service-role-key

app:
  security:
    mock-login-enabled: true
